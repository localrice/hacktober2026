{% extends "base.html" %}

{% block title %}Report - Seismic Vulnerability Reporting{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 640px;">
    
    <!-- Top Action Links -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h5 m-0 fw-semibold text-dark">Submit Report</h1>
        <div class="d-flex gap-3 small">
            <a href="{{ url_for('list_reports') }}" class="text-secondary text-decoration-none">Previous Reports</a>
            <a href="{{ url_for('logout') }}" class="text-secondary text-decoration-none">Logout</a>
        </div>
    </div>

    <!-- Live Camera Preview -->
    <div class="camera-box mb-3 position-relative bg-black" style="min-height: 380px;">
        <video id="cameraStream" autoplay playsinline muted class="w-100 h-100 object-fit-cover"></video>
        
        <!-- Standby Overlay -->
        <div id="cameraStandbyOverlay" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center text-center p-3 text-white bg-dark">
            <p class="mb-3 small">Camera preview inactive</p>
            <button type="button" id="startCameraBtn" class="btn btn-light btn-sm">Start Camera</button>
        </div>

        <div id="cameraControlsOverlay" class="d-none"></div>
        <canvas id="cameraCanvas" class="d-none"></canvas>
    </div>

    <!-- Capture and Device Selection Controls -->
    <div class="d-flex gap-2 mb-3">
        <button type="button" id="snapPhotoBtn" class="btn btn-dark flex-fill py-2">
            Capture Photo
        </button>
        <button type="button" id="triggerFilePickerBtn" class="btn btn-outline-dark flex-fill py-2">
            Select Images from Device
        </button>
        <button type="button" id="toggleCameraStreamBtn" class="btn btn-outline-secondary d-none">
            Switch Camera
        </button>
    </div>

    <!-- Submission Form -->
    <form id="submissionForm" action="{{ url_for('submit_report') }}" method="POST" enctype="multipart/form-data">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" id="latitudeInput" name="latitude" value="">
        <input type="hidden" id="longitudeInput" name="longitude" value="">
        <input type="hidden" id="accuracyInput" name="accuracy" value="">
        
        <input type="file" id="filePicker" name="images" multiple accept="image/*" class="d-none">

        <!-- Selected Images Previews Tray -->
        <div id="imageTrayContainer" class="d-none mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="small text-secondary">Selected Images (<span id="trayCountText">0</span>)</span>
                <button type="button" id="clearAllImagesBtn" class="btn btn-link btn-sm text-secondary p-0 text-decoration-none">Clear</button>
            </div>
            <div id="imageThumbnailsTray" class="d-flex flex-wrap gap-2 p-2 bg-light border">
                <!-- Dynamically rendered thumbnails -->
            </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitReportBtn" class="btn btn-dark w-100 py-2.5" disabled>
            <span id="submitReportBtnText">Submit Report</span>
            <span id="submitSpinner" class="spinner-border spinner-border-sm d-none ms-1" role="status"></span>
        </button>
    </form>

    <!-- Hidden elements for script hooks -->
    <div id="gpsStatusBadge" class="d-none"><span id="gpsStatusText"></span></div>
    <span id="imageCountBadge" class="d-none"></span>

</div>
{% endblock %}
